name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test -v ./...

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y debootstrap squashfs-tools xorriso liblz4-tool

      - name: Build binary
        run: make build

      - name: Build USB image (Debian Live)
        run: sudo make usb-live

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/drivesync-linux-amd64
            dist/drivesync-live-usb.zip
          generate_release_notes: true
          body: |
            ## Downloads

            | File | Description |
            |------|-------------|
            | `drivesync-linux-amd64` | Static binary for Linux |
            | `drivesync-live-usb.zip` | Debian Live bootable USB with full hardware support |

            ### Secure Boot Compatible
            Uses Debian's signed GRUB bootloader and works with Secure Boot enabled.
            No need to disable Secure Boot in BIOS.

            ### Usage
            1. Extract to a FAT32 USB drive
            2. Boot from USB (UEFI mode)
            3. DriveSync starts automatically
