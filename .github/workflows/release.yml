name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test -v ./...

      - name: Build binary
        run: make build

      - name: Build USB image
        run: make usb

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/drivesync-linux-amd64
            dist/drivesync-usb.zip
          generate_release_notes: true
